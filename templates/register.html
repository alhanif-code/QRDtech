<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Roboto, sans-serif;
            font-weight: 500;
        }

        body {
            background-color: antiquewhite;
        }

        .nav {
            display: flex;
            padding: 20px 2% 20px 2%;
            background-color: rgb(100, 57, 165);
        }

        .nav h1 {
            font-weight: 800;
        }

        .navbar{
            flex-direction: row;
        }
        
        .navbar a{
            text-decoration: none;
                
        }
        .register {
            display: flex;
            padding: 2% 10% 0 10%;

        }

        .login-form {
            background-color: rgb(100, 57, 165);
            padding: 5%;
            border: 2px solid rgb(39, 36, 43);
            border-radius: 16px;
            color: rgb(15, 12, 24);
        }
        
        .login-form h2{
            font-weight: 600;
        }
        
        .register-form{
            background-color: rgb(100, 57, 165);
            padding: 5%;
            border: 2px solid rgb(39, 36, 43);
            border-radius: 16px;
            color: rgb(15, 12, 24);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav">
            <h1>QRDtech</h1>
            <div class="navbar">
                <a href="">HOME</a>
                <a href="">ABOUT</a>
            </div>
        </div>

        <div class="register">
            <form method="POST" action="/login" class="login-form">
                <h2>Login</h2>
                <br>
                <label for="username/email">Username/Email:</label>
                <br>
                <input type="text" id="username/email" name="useremail" placeholder="Enter your username or email"
                    required>
                <br>
                <label for="password">Password:</label>
                <br>
                <input type="password" id="login_password" name="login_password" placeholder="Enter your password"
                    required>
                <br>
                <br>
                <button type="button" onclick="checkLogin()">submit</button>
                <br>
            </form>
            <form method="POST" action="/register" class="register-form">
                <h2>Sign In</h2>
                <br>
                <label for="username">Username:</label>
                <br>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
                <br>
                <label for="email">Email:</label>
                <br>
                <input type="text" id="email" name="email" placeholder="Enter your email" required>
                <br>
                <label for="password">Password:</label>
                <br>
                <input type="password" id="register_password" name="register_password" placeholder="Enter your password"
                    required>
                <br>
                <br>
                <button type="button" onclick="checkRegister()">submit</button>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='register.js') }}"></script>
</body>
</html>
